name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck service worker
        run: npx tsc --noEmit -p tsconfig.sw.json

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Runs the migrations against an embedded PostgreSQL and checks RLS, RPCs and triggers.
      - name: Database tests
        run: npm run test:db
